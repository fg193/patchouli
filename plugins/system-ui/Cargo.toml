[package]
name = "tauri-plugin-system-ui"
version = "0.1.0"
authors = [ "Patchouli contributors" ]
description = "Patchouli system UI integration"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-system-ui"

[dependencies]
tauri = { version = "2", default-features = false }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
