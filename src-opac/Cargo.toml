[package]
name = "patchouli-opac-api"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
